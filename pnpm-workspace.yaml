packages:
  - '.'
storeDir: A:/30.PROJECT/.pnpm_store
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExcludePrune: true
# Security exception: eMudhra CA mitigation and Chromium security backports.
# https://emudhra.we-have-a-problem.com/ and Electron v44.9.3 release notes.
minimumReleaseAgeExclude:
  - 'electron@44.9.3'
verifyDepsBeforeRun: error
allowBuilds:
  electron: true
  electron-winstaller: false
